<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FluxReveal Logo Preview</title>
<style>
    body {
        background: #0A0F1A;
        color: #E8ECF3;
        font-family: Inter, Arial, sans-serif;
        padding: 40px;
    }
    h1 {
        font-size: 2.4rem;
        margin-bottom: 10px;
    }
    h2 {
        margin-top: 50px;
        color: #00C2FF;
        font-size: 1.8rem;
    }
    .logo-box {
        background: #111827;
        padding: 30px;
        border-radius: 12px;
        margin-top: 20px;
        border: 1px solid #1F2937;
    }
</style>
</head>

<body>

<h1>FluxReveal Logo Concepts</h1>
<p>Below are the three logo concepts shown visually so you can compare them easily.</p>

<!-- Logo 1 -->
<h2>Logo 1 — Digital Waves (Tech Flow)</h2>
<div class="logo-box">
<svg width="260" height="70" viewBox="0 0 260 70">

  <!-- Tech Frame -->
  <rect x="10" y="10" width="50" height="50" rx="8" fill="#0A1F44" opacity="0.55"/>
  <rect x="10" y="10" width="50" height="50" rx="8" stroke="#00C2FF" stroke-width="1" opacity="0.35"/>

  <!-- Digital Waves -->
  <path d="M20 30 C30 20 40 40 50 30" stroke="#00C2FF" stroke-width="3" fill="none"/>
  <path d="M20 40 C30 30 40 50 50 40" stroke="#4DF3FF" stroke-width="2" fill="none" opacity="0.85"/>

  <!-- Text -->
  <text x="85" y="45"
        font-family="Inter, Arial"
        font-size="28"
        fill="#E8ECF3"
        letter-spacing="2">
    FluxReveal
  </text>

</svg>
</div>

<!-- Logo 2 -->
<h2>Logo 2 — Sharp Tech Waves (Angular, AI‑signal)</h2>
<div class="logo-box">
<svg width="260" height="70" viewBox="0 0 260 70">

  <!-- Frame -->
  <rect x="10" y="10" width="50" height="50" rx="6" fill="#0A1F44" opacity="0.45"/>

  <!-- Angular Waves -->
  <polyline points="20,30 30,20 40,40 50,30"
            stroke="#00C2FF" stroke-width="3" fill="none"/>
  <polyline points="20,40 30,30 40,50 50,40"
            stroke="#4DF3FF" stroke-width="2" fill="none" opacity="0.85"/>

  <!-- Text -->
  <text x="85" y="45"
        font-family="Inter, Arial"
        font-size="28"
        fill="#E8ECF3"
        letter-spacing="2">
    FluxReveal
  </text>

</svg>
</div>

<!-- Logo 3 -->
<h2>Logo 3 — Minimalist Tech Waves (Clean & Corporate)</h2>
<div class="logo-box">
<svg width="260" height="70" viewBox="0 0 260 70">

  <!-- Minimal Frame -->
  <rect x="10" y="10" width="50" height="50" rx="10" fill="#0A1F44" opacity="0.35"/>

  <!-- Smooth Digital Waves -->
  <path d="M20 32 C32 18 44 46 56 32"
        stroke="#00C2FF" stroke-width="3" fill="none"/>
  <path d="M20 42 C32 28 44 56 56 42"
        stroke="#4DF3FF" stroke-width="2" fill="none" opacity="0.85"/>

  <!-- Text -->
  <text x="85" y="45"
        font-family="Inter, Arial"
        font-size="28"
        fill="#E8ECF3"
        letter-spacing="2">
    FluxReveal
  </text>

</svg>
</div>

</body>
</html>
