<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FluxReveal Hero B Preview</title>
<style>
    body {
        margin: 0;
        background: #0A0F1A;
        font-family: Inter, Arial, sans-serif;
        color: #E8ECF3;
    }

    .hero {
        height: 80vh;
        background: url('https://images.unsplash.com/photo-1555949963-aa79dcee981c?auto=format&fit=crop&w=2000&q=90')
                    center/cover no-repeat;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Lighter overlay so image stays sharp */
    .hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.35); /* reduced from 0.55 */
    }

    .hero-content {
        position: relative;
        text-align: center;
        max-width: 800px;
        padding: 20px;
    }

    .hero h1 {
        font-size: 3.2rem;
        margin-bottom: 15px;
        letter-spacing: 1px;
        color: #FFFFFF;
        text-shadow: 0 0 12px rgba(0,0,0,0.4);
    }

    .hero p {
        font-size: 1.25rem;
        margin-bottom: 25px;
        color: #E8ECF3;
        text-shadow: 0 0 10px rgba(0,0,0,0.4);
    }

    .cta {
        display: inline-block;
        padding: 14px 32px;
        background: linear-gradient(90deg, #00C2FF, #4DF3FF);
        color: #0A0F1A;
        text-decoration: none;
        font-weight: bold;
        border-radius: 6px;
        transition: 0.2s ease;
        box-shadow: 0 0 12px rgba(0,0,0,0.4);
    }

    .cta:hover {
        background: linear-gradient(90deg, #4DF3FF, #7AFFD9);
    }
</style>
</head>

<body>

<section class="hero">
    <div class="hero-content">
        <h1>Connecting Systems. Enhancing Intelligence.</h1>
        <p>
            FluxReveal builds automation pipelines that unify systems, data, and AI —
            enabling organizations to operate with clarity, speed, and precision.
        </p>
        <a href="mailto:info@fluxreveal.com" class="cta">Contact Us</a>
    </div>
</section>

</body>
</html>
