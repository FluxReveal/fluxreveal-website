<svg width="320" height="90" viewBox="0 0 320 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#00C2FF"/>
      <stop offset="100%" stop-color="#7AFFD9"/>
    </linearGradient>
  </defs>

  <!-- Bold angular signal waves -->
  <polyline points="18,48 38,18 58,72 78,42"
            stroke="url(#waveGrad)"
