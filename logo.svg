/* Global */
body {
    margin: 0;
    font-family: "Inter", Arial, sans-serif;
    background: #0A0F1A;
    color: #E8ECF3;
}

/* Top bar */
.topbar {
    width: 100%;
    padding: 20px;
    display: flex;
    align-items: center;
}

.logo {
    width: 160px;
    opacity: 0.95;
}

/* Hero Section */
.hero {
    height: 75vh;
    background: url('https://images.unsplash.com/photo-1535223289827-42f1e9919769?auto=format&fit=crop&w=1600&q=80')
                center/cover no-repeat;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

.hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
}

.hero-content {
    position: relative;
    text-align: center;
    max-width: 700px;
    padding: 20px;
}

.hero h1 {
    font-size: 3.2rem;
    margin-bottom: 15px;
    letter-spacing: 1px;
}

.hero p {
    font-size: 1.2rem;
    margin-bottom: 25px;
    color: #C9D6E2;
}

/* CTA Button */
.cta {
    display: inline-block;
    padding: 12px 28px;
    background: #00C2FF;
    color: #0A0F1A;
    text-decoration: none;
    font-weight: bold;
    border-radius: 6px;
    transition: 0.2s ease;
}

.cta:hover {
    background: #00A0D1;
}

/* Sections */
.section {
    max-width: 800px;
    margin: 60px auto;
    padding: 0 20px;
    text-align: center;
}

.section h2 {
    font-size: 2rem;
    margin-bottom: 15px;
    color: #00C2FF;
}

.section p {
    font-size: 1.1rem;
    line-height: 1.6;
}

/* Contact */
.contact a {
    color: #00C2FF;
    font-size: 1.2rem;
    text-decoration: none;
}
