            stroke-width="5.5"
            fill="none"
            opacity="0.85"
            stroke-linecap="round"
            stroke-linejoin="round"/>

  <!-- Brand text -->
  <text x="100" y="58"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="38"
        font-weight="600"
        letter-spacing="1.5"
        fill="#F0F4F8">
    FluxReveal
