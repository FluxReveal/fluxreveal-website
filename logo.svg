<svg width="340" height="100" viewBox="0 0 340 100" xmlns="http://www.w3.org/2000/svg">

  <!-- Tech Frame -->
  <rect x="10" y="10" width="80" height="80" rx="10" fill="#0A1F44" opacity="0.55"/>
  <rect x="10" y="10" width="80" height="80" rx="10" stroke="#00C2FF" stroke-width="1.5" opacity="0.45"/>

  <!-- Angular Tech Waves (with gradient) -->
  <defs>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00C2FF"/>
      <stop offset="50%" stop-color="#4DF3FF"/>
      <stop offset="100%" stop-color="#7AFFD9"/>
    </linearGradient>
  </defs>

  <polyline points="25,45 40,25 55,65 70,45"
            stroke="url(#waveGrad)" stroke-width="5" fill="none" stroke-linecap="round"/>

  <polyline points="25,60 40,40 55,80 70,60"
            stroke="url(#waveGrad)" stroke-width="4" fill="none" opacity="0.9" stroke-linecap="round"/>

  <!-- Text -->
  <text x="110" y="65"
        font-family="Inter, Arial"
        font-size="40"
        fill="#E8ECF3"
        letter-spacing="3">
    FluxReveal
  </text>

</svg>
