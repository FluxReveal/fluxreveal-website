<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechSignalSix – Weekly Publishing Plan</title>
<style>
  :root { --bg: #0f172a; --card: #1e293b; --accent: #3b82f6; --text: #e2e8f0; --muted: #94a3b8; --green: #22c55e; --red: #ef4444; --pin: #fbbf24; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: linear-gradient(180deg, #0f172a 0%, #111827 100%); color: var(--text); margin: 0; padding: 1.5rem; line-height: 1.6; }
  .container { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 1.9rem; margin-bottom: 0.25rem; letter-spacing: -0.03em; }
  .meta { color: var(--muted); margin-bottom: 1.5rem; font-size: 0.9rem; }
  .post { background: var(--card); border-radius: 12px; padding: 1rem 1rem 0.9rem; margin-bottom: 1rem; border: 1px solid #334155; box-shadow: 0 8px 20px rgba(15, 23, 42, 0.2); }
  .post.featured { border-color: rgba(251, 191, 36, 0.6); background: linear-gradient(180deg, rgba(30, 41, 59, 0.96), rgba(17, 24, 39, 0.96)); }
  .post h2 { margin: 0 0 0.35rem; font-size: 1.08rem; color: #93c5fd; }
  .post pre { background: #0f172a; padding: 0.8rem 0.85rem; border-radius: 8px; white-space: pre-wrap; font-size: 0.88rem; margin: 0.65rem 0 0.9rem; overflow-x: auto; line-height: 1.45; color: #dbeafe; border: 1px solid rgba(148, 163, 184, 0.18); }
  .pin-tag { display: inline-block; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: #111827; background: var(--pin); padding: 0.22rem 0.5rem; border-radius: 999px; margin-bottom: 0.5rem; }
  .btn { display: inline-block; background: #1d9bf0; color: white; text-decoration: none; padding: 0.58rem 1.1rem; border-radius: 999px; font-weight: 700; font-size: 0.88rem; }
  .btn:hover { background: #1a8cd8; }
  .error { background: #7f1d1d; padding: 1rem; border-radius: 8px; }
  .day { font-size: 0.7rem; color: #a5b4fc; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.3rem; font-weight: 700; }
  .metrics { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.4rem; }
  .counter { display: inline-block; margin-left: 0.75rem; font-size: 0.8rem; color: var(--muted); }
  .counter.over { color: #fecaca; background: rgba(239, 68, 68, 0.25); padding: 0.15rem 0.5rem; border-radius: 999px; font-weight: 700; }
  /* Pinned weekly post (hard-coded, see PINNED_POST in script) */
  .pinned-section { margin-bottom: 1.75rem; }
  .pinned-section .section-label { font-size: 0.72rem; color: #22d3ee; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; margin-bottom: 0.5rem; }
  .post.pinned { border-color: rgba(34, 211, 238, 0.55); background: linear-gradient(180deg, rgba(15, 23, 42, 0.98), rgba(30, 41, 59, 0.96)); box-shadow: 0 8px 24px rgba(34, 211, 238, 0.08); }
  .post.pinned h2 { color: #ffffff; }
  .pinned-tag { display: inline-block; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: #0f172a; background: #22d3ee; padding: 0.22rem 0.5rem; border-radius: 999px; margin-bottom: 0.5rem; }
  .post.pinned pre { color: #ffffff; border-color: rgba(34, 211, 238, 0.25); }
  .post.pinned pre .pinned-about { display: block; font-size: 0.8rem; color: var(--muted); }
  button.btn { border: none; cursor: pointer; font-family: inherit; line-height: inherit; margin-right: 0.4rem; }
</style>
</head>
<body>
<div class="container">
  <h1>TechSignalSix – Weekly Plan</h1>
  <div class="meta" id="meta">Loading signals…</div>
  <div id="pinned" class="pinned-section"></div>
  <div id="content"></div>
</div>

<script>
const API = 'https://techsignalsix.com/api/signals.json';
const ACCOUNT = 'TechSignalSix';

// ===================== PINNED POST (weekly, hard-coded) =====================
// HOW TO UPDATE (once per week, by editing this file):
//  1. Set `week` and `publishedDate` to the new week from signals.json.
//  2. Replace the five `top` entries with the five highest-ranked themes
//     (by rank) from trendingSignals: one short, punchy line each.
//     Rule: no score numbers, score changes or momentum direction.
//  3. Rewrite `why` (one short paragraph tying the week together).
//  4. `about` is generic and can stay the same for several weeks.
//  5. Also update DAILY_POSTS below (Monday–Friday = top 5, Saturday = light post) for the same week.
//  Do not use em-dashes in the post text.
const PINNED_POST = {
  week: '2026-W43',
  publishedDate: '2026-10-25',
  heading: 'TechSignalSix Top 5 · Week 43, 2026',
  top: [
    { rank: 1, title: 'Agent Interoperability Protocols', line: 'Open protocols like MCP are becoming the standard wiring between AI agents, tools and data. The plumbing is the product now.' },
    { rank: 2, title: 'AI Coding Agents', line: 'Developers now hand whole tasks to agents that plan, edit, test and open the pull request. Autocomplete was just the warm-up.' },
    { rank: 3, title: 'AI Inference Infrastructure', line: 'Same GPUs, several times the throughput. The serving engine decides whether an AI feature makes money.' },
    { rank: 4, title: 'Small Language Models & On-Device AI', line: 'Models that fit on a laptop or phone now handle real production work. Not every job needs a data center.' },
    { rank: 5, title: 'Memory-Safe Systems Programming', line: 'Governments and flagship codebases are making memory-safe languages the default for new systems code. "We have always used C" is not a strategy.' }
  ],
  why: 'Why this matters: AI is moving from demos to operations. Agents need open protocols to reach tools and data, coding agents are changing how software gets built, and the serving layer and smaller models decide what AI costs to run. Underneath it all, new systems code is moving to memory-safe foundations.',
  hashtag: '#SixTraction',
  about: 'About TechSignalSix: a weekly radar of tech themes across AI, software, infrastructure, automation and digital transformation. Signals are based on adoption data such as GitHub activity and package downloads.\nFollow technology. Not the noise.\nhttps://techsignalsix.com'
};

function pinnedParts(p = PINNED_POST) {
  const main = [
    p.heading,
    p.top.map(t => `#${t.rank} ${t.title}: ${t.line}`).join('\n\n'),
    p.why,
    p.hashtag
  ].filter(Boolean).join('\n\n');
  return { main, about: p.about || '' };
}

function buildPinnedText(p = PINNED_POST) {
  const { main, about } = pinnedParts(p);
  return [main, about].filter(Boolean).join('\n\n');
}

function escPinned(str) {
  return String(str).replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>').replace(/"/g, '"');
}

function renderPinned() {
  const el = document.getElementById('pinned');
  if (!el) return;
  const text = buildPinnedText();
  const { main, about } = pinnedParts();
  el.innerHTML = `
    <div class="section-label">Pinned post · Week ${escPinned(PINNED_POST.week)} · Published ${escPinned(PINNED_POST.publishedDate)}</div>
    <div class="post pinned">
      <div class="pinned-tag">Pinned post</div>
      <h2>Weekly pinned post for @${ACCOUNT}</h2>
      <pre>${escPinned(main)}${about ? `\n\n<span class="pinned-about">${escPinned(about)}</span>` : ''}</pre>
      <button type="button" class="btn" id="pinned-copy">Copy</button>
      <a class="btn" href="${buildIntent(text)}" target="_blank" rel="noopener">Open in X</a>
      ${counterHtml(text)}
    </div>`;
  const btn = document.getElementById('pinned-copy');
  btn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(text);
      btn.textContent = 'Copied!';
    } catch (e) {
      btn.textContent = 'Copy failed';
    }
    setTimeout(() => { btn.textContent = 'Copy'; }, 1800);
  });
}
// =================== END PINNED POST ===================

function buildIntent(text) {
  const params = new URLSearchParams({ text, via: ACCOUNT });
  return `https://x.com/intent/tweet?${params.toString()}`;
}

// X counts every URL as 23 characters
function xLength(text) {
  return text.replace(/https?:\/\/\S+/g, 'x'.repeat(23)).length;
}

function counterHtml(text, longform = false) {
  const n = xLength(text);
  const limit = longform ? 25000 : 280;
  const over = n > limit;
  const label = longform ? '25,000 · long-form (X Premium)' : '280';
  return `<span class="counter ${over ? 'over' : ''}">${n} / ${label}${over ? ' · over limit' : ''}</span>`;
}

// Fixed footer appended to every daily draft (Monday–Saturday)
const DRAFT_ABOUT = 'Weekly radar of what developers actually adopt — not what gets hyped.';
const DRAFT_HASHTAG = '#SixTraction';
function withFooter(text) {
  return `${text}\n\n${DRAFT_ABOUT}\n${DRAFT_HASHTAG}`;
}

// ===================== DAILY POSTS (weekly, hard-coded) =====================
// Same week as PINNED_POST. Monday–Friday = top 5 by Six Traction rank (#1 Monday … #5 Friday).
// Monday–Friday are long-form (X Premium, longform: true): full `text` without the footer; withFooter() adds it once.
// Saturday = one long-form post (X Premium, longform: true) on the big lines across all themes; uses `text` instead of lead/why.
// Each post: lead (rank + theme), a short "Why it matters", the theme link, then the fixed footer.
// Rules: English, no score changes / rises / falls / week-over-week movement, no invented facts.
// Must stay under 280 characters as X counts them (URL = 23), or 25,000 for longform posts. The counter flags overruns.
// The theme link is taken from signals.json (absoluteUrl) when available.
const DAILY_POSTS = [
  { day: 'Monday', id: 'agent-interoperability', title: "Agent Interoperability Protocols", longform: true,
    text: "#1 on the radar this week: Agent Interoperability Protocols.\n\nIn plain terms: a shared language that lets an AI agent find a tool, learn what it does and call it, without a hand-built connector for every pairing. Model Context Protocol (MCP) is the best-known example.\n\nWhat's happening: MCP's reference servers hit a 2.0 release that keeps older clients working, GitHub now reports custom MCP servers separately in Copilot usage metrics, and AWS added OAuth-based sessions for agents reaching MCP tools from WorkSpaces.\n\nWhy it matters: integrations used to be the slow, expensive part of every AI project. A shared protocol turns them into reusable building blocks. The flip side: each server you expose is a door into your systems, so identity, scopes and audit logs belong in the design from day one.\n\nSpec: https://modelcontextprotocol.io/\n\nhttps://techsignalsix.com/themes/agent-interoperability/" },
  { day: 'Tuesday', id: 'ai-coding-agents', title: "AI Coding Agents", longform: true,
    text: "#2 on the radar this week: AI Coding Agents.\n\nThis is not autocomplete. You hand over a scoped task, such as fixing a bug or adding an endpoint, and the agent reads the repo, changes files, runs the tests and comes back with a pull request for a human to review.\n\nWhat's happening: Claude Code, OpenAI Codex, Gemini CLI and the open-source OpenHands all shipped releases within days of each other, and the common thread was guardrails: sandboxed execution, OAuth for enterprise connections, read-only workspace modes and masked secrets. Real teams are using them on production work, with Cloudflare putting Codex to work on building code.\n\nWhy it matters: the scarce resource moves from typing code to specifying work and reviewing it well. Teams that invest in clear tickets, fast CI and strong tests get the most out of agents. Teams without them just get more unreviewed code, faster.\n\nhttps://techsignalsix.com/themes/ai-coding-agents/" },
  { day: 'Wednesday', id: 'ai-inference-infrastructure', title: "AI Inference Infrastructure", longform: true,
    text: "#3 on the radar this week: AI Inference Infrastructure. #SixTraction\n\nTraining gets the headlines, but inference is where an AI product lives every day: each prompt, each agent step, each generated token runs through a serving engine. Engines like vLLM and SGLang decide how many requests one GPU can handle through batching, caching and smart scheduling.\n\nWhat's happening: both vLLM and SGLang shipped large releases backed by hundreds of contributors. llm-d 1.0, backed by Google and Red Hat, brings distributed inference to Kubernetes and has joined the CNCF Sandbox.\n\nWhy it matters: once a feature ships, inference is a recurring cost that grows with every user. Choosing and tuning the serving layer can change your margins without touching the model. Treat it as a platform decision, with benchmarks on your own workloads, not as a default you inherit.\n\nDocs: https://docs.vllm.ai/\n\nhttps://techsignalsix.com/themes/ai-inference-infrastructure/" },
  { day: 'Thursday', id: 'small-language-models', title: "Small Language Models & On-Device AI", longform: true,
    text: "#4 on the radar this week: Small Language Models & On-Device AI. #SixTraction\n\nNot every AI task needs a frontier model in a data center. Compact models running on a laptop, a phone or a single modest server can now classify, extract, summarize and route reliably enough for production.\n\nWhat's happening: Ollama added a family of models built to classify and score inputs rather than write free text. AWS offers serverless fine-tuning for small models such as Ministral, and its Strands Agents framework can send routine steps to local models through Ollama.\n\nWhy it matters: a common pattern is emerging. Use a large model where reasoning is hard, and a small local one for the high-volume, repetitive work. That lowers cost and latency, and keeps sensitive data on hardware you control, which helps with privacy and data-residency rules.\n\nTry it: https://ollama.com/\n\nhttps://techsignalsix.com/themes/small-language-models/" },
  { day: 'Friday', id: 'memory-safe-systems', title: "Memory-Safe Systems Programming", longform: true,
    text: "#5 on the radar this week: Memory-Safe Systems Programming. #SixTraction\n\nC and C++ let a program touch memory it should not. That one class of bug sits behind a large share of serious security holes. Memory-safe languages, with Rust leading for systems work, rule most of those bugs out at compile time.\n\nWhat's happening: a slow, structural shift, not a news cycle. Rust ships steady releases, crates like serde and tokio are everyday infrastructure, and the shift is reaching developer tooling too: Cloudflare is working on tsrs, a Rust port of the TypeScript compiler. Agencies such as CISA now ask vendors for memory-safety roadmaps.\n\nWhy it matters: rewriting everything is rarely realistic. The practical policy is to write new components in a memory-safe language and isolate the legacy code you keep. Start with parsers and anything handling untrusted input.\n\nhttps://www.rust-lang.org/\n\nhttps://techsignalsix.com/themes/memory-safe-systems/" },
  { day: 'Saturday', id: 'all-themes', title: 'The big lines across all themes', longform: true,
    // Long-form X Premium post. Full text below; withFooter() adds the footer once.
    text: "The model is no longer the story. The system around it is. #SixTraction\n\nWe track nine technology themes on the Six Traction radar. Step back from the weekly ranking and four big lines show up.\n\n1. Agents are becoming a primary user of your stack.\nAgent Interoperability Protocols sits at #1 and AI Coding Agents at #2. But the signal runs wider: Vector Search & Agent Memory is about how agents remember, WebAssembly is spreading into sandboxes for AI-generated code, and Aspire now documents a setup so coding agents can start, inspect and debug an app. Builders: design APIs, permissions and docs for agents as well as humans.\n\n2. The bottleneck has moved from the model to the plumbing.\nRetrieval quality, not model choice, limits AI answers on your own data. Serving engines get several times the throughput from the same GPUs. Models small enough for laptops and phones now handle real production tasks. The edge comes from how you serve, retrieve and route, and it shows up directly in unit economics.\n\n3. Safety is moving into the defaults.\nMemory-safe languages are becoming the default for new systems code. Post-quantum migration is underway, driven by regulatory deadlines. Wasm offers isolation where containers are too slow or too risky. Coding agents ship sandboxing, OAuth and read-only workspaces. Security is now an architecture choice, not a later audit.\n\n4. Tools are ready. Standards are still forming.\nCoding agents, inference infrastructure, vector search and memory-safe languages sit at Adopt maturity. Agent protocols, small models, WebAssembly and post-quantum crypto are still Emerging. Use what works now, but keep the wiring swappable while the standards settle.\n\nThe takeaway for tech leaders: the competitive edge is shifting from which model you pick to how well your system connects, serves, remembers and contains it.\n\nAll themes: https://techsignalsix.com/themes/" }
];

function themeUrl(id, signals = []) {
  const s = signals.find(x => x.id === id);
  return (s && s.absoluteUrl) || `https://techsignalsix.com/themes/${id}/`;
}

function generatePosts(data = {}) {
  const signals = data.trendingSignals || [];
  return DAILY_POSTS.map(d => ({
    day: d.day,
    title: d.title,
    longform: !!d.longform,
    text: d.text ? withFooter(d.text) : withFooter(`${d.lead}\n\n${d.why}\n\n${themeUrl(d.id, signals)}`)
  }));
}
// =================== END DAILY SPOTLIGHTS ===================

function renderPosts(posts) {
  return posts.map((p, i) => `
      <div class="post">
        <div class="day">${p.day}${p.longform ? ' <span class="pinned-tag" style="margin:0 0 0 0.4rem;padding:0.1rem 0.45rem;font-size:0.62rem;">Long-form</span>' : ''}</div>
        <h2>${escPinned(p.title)}</h2>
        <pre>${escPinned(p.text)}</pre>
        ${p.longform ? `<button type="button" class="btn post-copy" data-idx="${i}">Copy</button>` : ''}
        <a class="btn" href="${buildIntent(p.text)}" target="_blank" rel="noopener">Open in X</a>
        ${counterHtml(p.text, p.longform)}
      </div>`).join('');
}

async function load() {
  const content = document.getElementById('content');
  const meta = document.getElementById('meta');
  let data = null;
  try {
    // no-store + cache-buster so a fresh weekly update is never hidden by a cached copy
    const res = await fetch(`${API}?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
    meta.textContent = `Week ${data.week || '?'} · Published ${data.publishedDate || '?'} · Generated ${new Date(data.generatedAt).toLocaleString()}`;
  } catch (err) {
    meta.textContent = `Could not load signals.json (${err.message}). Showing drafts for ${PINNED_POST.week}.`;
  }
  const stale = data && data.week && data.week !== PINNED_POST.week;
  const posts = generatePosts(data || {});
  content.innerHTML =
    (stale ? `<div class="error">Heads-up: signals.json is ${escPinned(data.week)}, but the prepared posts are for ${escPinned(PINNED_POST.week)}. Update PINNED_POST and DAILY_POSTS in this file.</div>` : '') +
    renderPosts(posts);
  content.querySelectorAll('button.post-copy').forEach(btn => {
    btn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(posts[Number(btn.dataset.idx)].text);
        btn.textContent = 'Copied!';
      } catch (e) {
        btn.textContent = 'Copy failed';
      }
      setTimeout(() => { btn.textContent = 'Copy'; }, 1800);
    });
  });
}

renderPinned();
load();
</script>
</body>
</html>
