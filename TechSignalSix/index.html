<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechSignalSix – Weekly Publishing Plan</title>
<style>
  :root { --bg: #0f172a; --card: #1e293b; --accent: #3b82f6; --text: #e2e8f0; --muted: #94a3b8; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 1.5rem; line-height: 1.5; }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.8rem; margin-bottom: 0.25rem; }
  .meta { color: var(--muted); margin-bottom: 1.5rem; font-size: 0.9rem; }
  .post { background: var(--card); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; border: 1px solid #334155; }
  .post h2 { margin: 0 0 0.5rem; font-size: 1.1rem; color: #93c5fd; }
  .post pre { background: #0f172a; padding: 0.75rem; border-radius: 8px; white-space: pre-wrap; font-size: 0.95rem; margin: 0.75rem 0; overflow-x: auto; }
  .btn { display: inline-block; background: #1d9bf0; color: white; text-decoration: none; padding: 0.6rem 1.2rem; border-radius: 999px; font-weight: 600; font-size: 0.95rem; }
  .btn:hover { background: #1a8cd8; }
  .error { background: #7f1d1d; padding: 1rem; border-radius: 8px; }
  .loading { color: var(--muted); }
  .day { font-size: 0.8rem; color: #a5b4fc; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem; }
</style>
</head>
<body>
<div class="container">
  <h1>TechSignalSix – Weekly Plan</h1>
  <div class="meta" id="meta">Loading signals…</div>
  <div id="content"></div>
</div>

<script>
const API = 'https://techsignalsix.com/api/signals.json';
const ACCOUNT = 'TechSignalSix'; // via-parameter

function truncate(str, max = 240) {
  if (str.length <= max) return str;
  return str.slice(0, max - 1) + '…';
}

function buildIntent(text) {
  const params = new URLSearchParams({
    text: text,
    via: ACCOUNT
  });
  return `https://x.com/intent/tweet?${params.toString()}`;
}

function generatePosts(data) {
  const posts = [];
  const week = data.week || 'current week';
  const ws = data.weeklySignal || {};
  const signals = data.trendingSignals || [];

  // Monday – Weekly summary
  const summaryText = truncate(
    `${ws.headline || 'Weekly Tech Signal'}\n\n` +
    (ws.summary || '').split('\n')[0] + '\n\n' +
    `Full radar → techsignalsix.com`
  );
  posts.push({
    day: 'Monday',
    title: 'Weekly Overview (pin this)',
    text: summaryText,
    link: 'https://techsignalsix.com'
  });

  // Individual signals (Tue–Fri)
  const days = ['Tuesday', 'Wednesday', 'Thursday', 'Friday'];
  signals.slice(0, 4).forEach((s, i) => {
    const delta = s.score - (s.previousScore || s.score);
    const deltaStr = delta > 0 ? `+${delta}` : `${delta}`;
    const text = truncate(
      `${s.title} (${s.score}${deltaStr ? ' ' + deltaStr : ''})\n` +
      `Momentum: ${s.momentum}\n\n` +
      (s.summary || '').slice(0, 140) + '\n\n' +
      `https://techsignalsix.com${s.url || ''}`
    );
    posts.push({
      day: days[i] || 'Later',
      title: s.title,
      text,
      link: s.absoluteUrl || `https://techsignalsix.com${s.url}`
    });
  });

  return posts;
}

async function load() {
  const content = document.getElementById('content');
  const meta = document.getElementById('meta');
  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();

    meta.textContent = `Week ${data.week || '?'} · Published ${data.publishedDate || '?'} · Generated ${new Date(data.generatedAt).toLocaleString()}`;

    const posts = generatePosts(data);
    content.innerHTML = posts.map(p => `
      <div class="post">
        <div class="day">${p.day}</div>
        <h2>${p.title}</h2>
        <pre>${p.text}</pre>
        <a class="btn" href="${buildIntent(p.text)}" target="_blank" rel="noopener">Open in X</a>
      </div>
    `).join('');
  } catch (err) {
    content.innerHTML = `<div class="error">Could not load signals.json (${err.message}). Check CORS or try again later.</div>`;
    meta.textContent = 'Error loading data';
  }
}

load();
</script>
</body>
</html>
