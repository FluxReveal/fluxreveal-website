<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechSignalSix – Weekly Publishing Plan</title>
<style>
  :root { --bg: #0f172a; --card: #1e293b; --accent: #3b82f6; --text: #e2e8f0; --muted: #94a3b8; --green: #22c55e; --red: #ef4444; --pin: #fbbf24; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: linear-gradient(180deg, #0f172a 0%, #111827 100%); color: var(--text); margin: 0; padding: 1.5rem; line-height: 1.6; }
  .container { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 1.9rem; margin-bottom: 0.25rem; letter-spacing: -0.03em; }
  .meta { color: var(--muted); margin-bottom: 1.5rem; font-size: 0.9rem; }
  .post { background: var(--card); border-radius: 12px; padding: 1rem 1rem 0.9rem; margin-bottom: 1rem; border: 1px solid #334155; box-shadow: 0 8px 20px rgba(15, 23, 42, 0.2); }
  .post.featured { border-color: rgba(251, 191, 36, 0.6); background: linear-gradient(180deg, rgba(30, 41, 59, 0.96), rgba(17, 24, 39, 0.96)); }
  .post h2 { margin: 0 0 0.35rem; font-size: 1.08rem; color: #93c5fd; }
  .post pre { background: #0f172a; padding: 0.8rem 0.85rem; border-radius: 8px; white-space: pre-wrap; font-size: 0.88rem; margin: 0.65rem 0 0.9rem; overflow-x: auto; line-height: 1.45; color: #dbeafe; border: 1px solid rgba(148, 163, 184, 0.18); }
  .pin-tag { display: inline-block; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: #111827; background: var(--pin); padding: 0.22rem 0.5rem; border-radius: 999px; margin-bottom: 0.5rem; }
  .btn { display: inline-block; background: #1d9bf0; color: white; text-decoration: none; padding: 0.58rem 1.1rem; border-radius: 999px; font-weight: 700; font-size: 0.88rem; }
  .btn:hover { background: #1a8cd8; }
  .error { background: #7f1d1d; padding: 1rem; border-radius: 8px; }
  .day { font-size: 0.7rem; color: #a5b4fc; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.3rem; font-weight: 700; }
  .metrics { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.4rem; }
  .counter { display: inline-block; margin-left: 0.75rem; font-size: 0.8rem; color: var(--muted); }
  .counter.over { color: #fecaca; background: rgba(239, 68, 68, 0.25); padding: 0.15rem 0.5rem; border-radius: 999px; font-weight: 700; }
  /* Pinned weekly post (hard-coded, see PINNED_POST in script) */
  .pinned-section { margin-bottom: 1.75rem; }
  .pinned-section .section-label { font-size: 0.72rem; color: #22d3ee; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; margin-bottom: 0.5rem; }
  .post.pinned { border-color: rgba(34, 211, 238, 0.55); background: linear-gradient(180deg, rgba(15, 23, 42, 0.98), rgba(30, 41, 59, 0.96)); box-shadow: 0 8px 24px rgba(34, 211, 238, 0.08); }
  .post.pinned h2 { color: #ffffff; }
  .pinned-tag { display: inline-block; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: #0f172a; background: #22d3ee; padding: 0.22rem 0.5rem; border-radius: 999px; margin-bottom: 0.5rem; }
  .post.pinned pre { color: #ffffff; border-color: rgba(34, 211, 238, 0.25); }
  .post.pinned pre .pinned-about { display: block; font-size: 0.8rem; color: var(--muted); }
  .help { background: rgba(34, 211, 238, 0.08); border: 1px solid rgba(34, 211, 238, 0.35); border-radius: 8px; padding: 0.6rem 0.8rem; font-size: 0.88rem; margin-bottom: 1.25rem; }
  .copy-note { display: inline-block; margin-left: 0.6rem; font-size: 0.8rem; color: var(--green); }
  .cut-mark { display: inline-block; font-size: 0.68rem; font-weight: 700; color: #0f172a; background: #fbbf24; border-radius: 999px; padding: 0 0.4rem; margin: 0 0.2rem; white-space: nowrap; }
  button.btn { border: none; cursor: pointer; font-family: inherit; line-height: inherit; margin-right: 0.4rem; }
</style>
</head>
<body>
<div class="container">
  <h1>TechSignalSix – Weekly Plan</h1>
  <div class="meta" id="meta">Loading signals…</div>
  <div class="help">Manual fallback: log in to X as @TechSignalSix, press Post to X on today's card, check the text, then Post. Pin only the Sunday roundup.</div>
  <div id="pinned" class="pinned-section"></div>
  <div id="content"></div>
</div>

<script>
const API = 'https://techsignalsix.com/api/signals.json';
const ACCOUNT = 'TechSignalSix';

// ===================== PINNED POST (weekly, hard-coded) =====================
// HOW TO UPDATE (once per week, by editing this file):
//  1. Set `week` and `publishedDate` to the new week from signals.json.
//  2. Replace the five `top` entries with the five highest-ranked themes
//     (by rank) from trendingSignals: one short, punchy line each.
//     Rule: no score numbers, score changes or momentum direction.
//  3. Rewrite `why` (one short paragraph tying the week together).
//  4. `about` is generic and can stay the same for several weeks.
//  5. Also update DAILY_POSTS below (Monday–Friday = top 5, Saturday = long-form big-lines post) for the same week.
//  6. Do NOT touch postToXHtml()/buildIntent()/withFooter()/withFirstLineTag(): they guarantee the
//     Post to X button gives the composer exactly the planned text (no "via" or extra hashtag parameters).
//  Do not use em-dashes in the post text.
const PINNED_POST = {
  week: '2026-W44',
  publishedDate: '2026-11-01',
  heading: "TechSignalSix Top 5 · Week 44, 2026",
  // Hook: heading + hook must fit in the first 280 characters (what X shows before "Show more"), with #SixTraction inside.
  hook: "AI headlines chase the next big model. Developer adoption data points somewhere else: the machinery that makes AI actually work. The 5 technologies developers are really adopting this week, and why #1 is not a model at all. #SixTraction",
  top: [
    { rank: 1, title: "Agent Interoperability Protocols", line: "MCP and A2A are turning \"connect the agent to our systems\" from a custom project into a standard plug. The hard part now is permissions." },
    { rank: 2, title: "AI Coding Agents", line: "Agents that take a task and hand back a pull request now ship updates every week. The new bottleneck is human review." },
    { rank: 3, title: "Small Language Models & On-Device AI", line: "Compact models on laptops, phones and edge servers do real work, cheaper and faster, without your data leaving the building." },
    { rank: 4, title: "Vector Search & Agent Memory", line: "The model is rarely the weak spot. What your AI can find, and remember, decides how good its answers are." },
    { rank: 5, title: "AI Inference Infrastructure", line: "The serving layer turns GPU hours into answers. Tune it well and the same hardware serves far more users." }
  ],
  why: "Why this matters: this week's top 5 is less about smarter models and more about everything around them: how agents connect, write code, remember and run, and what that costs. That is where AI projects succeed or stall.",
  hashtag: '#SixTraction',
  about: "About TechSignalSix: a weekly radar of tech themes across AI, software, infrastructure, automation and digital transformation. Signals are based on adoption data such as GitHub activity and package downloads.\nFollow technology. Not the noise.\nhttps://techsignalsix.com"
};

function pinnedParts(p = PINNED_POST) {
  const main = [
    p.heading,
    p.hook,
    p.top.map(t => `#${t.rank} ${t.title}: ${t.line}`).join('\n\n'),
    p.why,
    p.hashtag
  ].filter(Boolean).join('\n\n');
  return { main, about: p.about || '' };
}

function buildPinnedText(p = PINNED_POST) {
  const { main, about } = pinnedParts(p);
  return [main, about].filter(Boolean).join('\n\n');
}

function escPinned(str) {
  // Entities are built from AMP so this source never contains literal entity text
  // (the GitHub commit tool decodes literal entities, which silently broke this function before).
  const AMP = String.fromCharCode(38);
  const map = { '&': AMP + 'amp;', '<': AMP + 'lt;', '>': AMP + 'gt;', '"': AMP + 'quot;' };
  return String(str).replace(/[&<>"]/g, c => map[c]);
}

// X shows roughly the first 280 characters of a long post before "Show more".
const PIN_CUT = 280;
function renderPinned() {
  const el = document.getElementById('pinned');
  if (!el) return;
  const text = buildPinnedText();
  const { main, about } = pinnedParts();
  el.innerHTML = `
    <div class="section-label">Pinned post · Week ${escPinned(PINNED_POST.week)} · Published ${escPinned(PINNED_POST.publishedDate)}</div>
    <div class="post pinned">
      <div class="pinned-tag">Pinned post</div>
      <h2>Weekly pinned post for @${ACCOUNT}</h2>
      <div class="metrics">The <span class="cut-mark">280</span> mark shows where X cuts the post with "Show more": everything before it is visible in the timeline.</div>
      <pre>${escPinned(main.slice(0, PIN_CUT))}<span class="cut-mark" title="X shows the first 280 characters before Show more">280 · Show more</span>${escPinned(main.slice(PIN_CUT))}${about ? `\n\n<span class="pinned-about">${escPinned(about)}</span>` : ''}</pre>
      <button type="button" class="btn" id="pinned-copy">Copy</button>
      ${postToXHtml(text)}
      ${counterHtml(text, true)}
    </div>`;
  wirePostToX(el);
  const btn = document.getElementById('pinned-copy');
  btn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(text);
      btn.textContent = 'Copied!';
    } catch (e) {
      btn.textContent = 'Copy failed';
    }
    setTimeout(() => { btn.textContent = 'Copy'; }, 1800);
  });
}
// =================== END PINNED POST ===================

// ===================== POST TO X (manual fallback) =====================
// The intent URL carries ONLY the exact final text: no "via", "related" or "hashtags" parameters,
// so X adds nothing (the "via" parameter is what appended "via @TechSignalSix" to W43 posts).
const INTENT_BASE = 'https://x.com/intent/post?text=';
const COMPOSE_URL = 'https://x.com/compose/post';
// Above this encoded length the prefill is not considered reliable: the button then opens an
// empty composer and relies on the clipboard copy instead.
const MAX_INTENT_URL = 8000;
function buildIntent(text) {
  return INTENT_BASE + encodeURIComponent(text);
}
function postToXHref(text) {
  const url = buildIntent(text);
  return url.length <= MAX_INTENT_URL ? url : COMPOSE_URL;
}
// Post to X: a normal link (works without JS), and on click it ALSO copies the full text
// to the clipboard, so pasting is a fallback if the composer is empty or cut off.
function postToXHtml(text) {
  return `<a class="btn post-to-x" href="${escPinned(postToXHref(text))}" target="_blank" rel="noopener" data-text="${escPinned(encodeURIComponent(text))}">Post to X</a><span class="copy-note" hidden>Text copied — paste into the composer if it is empty or cut off</span>`;
}
function wirePostToX(root) {
  root.querySelectorAll('a.post-to-x').forEach(a => {
    a.addEventListener('click', () => {
      const text = decodeURIComponent(a.dataset.text);
      const note = a.nextElementSibling;
      const show = msg => { if (note) { note.textContent = msg; note.hidden = false; } };
      try {
        navigator.clipboard.writeText(text).then(
          () => show('Text copied — paste into the composer if it is empty or cut off'),
          () => show('Could not copy — use the Copy button if the composer is empty'));
      } catch (e) {
        show('Could not copy — use the Copy button if the composer is empty');
      }
    });
  });
}
// =================== END POST TO X ===================

// X counts every URL as 23 characters
function xLength(text) {
  return text.replace(/https?:\/\/\S+/g, 'x'.repeat(23)).length;
}

function counterHtml(text, longform = false) {
  const n = xLength(text);
  const limit = longform ? 25000 : 280;
  const over = n > limit;
  const label = longform ? '25,000 · long-form (X Premium)' : '280';
  return `<span class="counter ${over ? 'over' : ''}">${n} / ${label}${over ? ' · over limit' : ''}</span>`;
}

// Fixed footer appended to every daily draft (Monday–Saturday)
const DRAFT_ABOUT = 'Weekly radar of what developers actually adopt — not what gets hyped.';
const DRAFT_HASHTAG = '#SixTraction';
const FOOTER = `\n\n${DRAFT_ABOUT}\n${DRAFT_HASHTAG}`;
// Adds the footer exactly once (no-op if the text already ends with it).
function withFooter(text) {
  const t = String(text).replace(/\s+$/, '');
  return t.endsWith(FOOTER) ? t : `${t}${FOOTER}`;
}
// Rule for long-form daily posts: the first line ends with " #SixTraction" (added if missing).
function withFirstLineTag(text) {
  const t = String(text);
  const i = t.indexOf('\n');
  const first = i === -1 ? t : t.slice(0, i);
  const rest = i === -1 ? '' : t.slice(i);
  return first.trimEnd().endsWith(DRAFT_HASHTAG) ? t : `${first.trimEnd()} ${DRAFT_HASHTAG}${rest}`;
}

// ===================== DAILY POSTS (weekly, hard-coded) =====================
// Same week as PINNED_POST. Monday–Friday = top 5 by Six Traction rank (#1 Monday … #5 Friday).
// Monday–Friday are long-form (X Premium, longform: true): full `text` without the footer; withFooter() adds it once.
// Saturday = one long-form post (X Premium, longform: true) on the big lines across all themes; uses `text` instead of lead/why.
// Each post: lead (rank + theme), a short "Why it matters", the theme link, then the fixed footer.
// Long-form `text`: write it WITHOUT the footer; generatePosts() adds " #SixTraction" to the first line if missing
// and withFooter() adds the footer exactly once. Every card gets Copy + Post to X (exact text, nothing added by X).
// Rules: English, no score changes / rises / falls / week-over-week movement, no invented facts.
// Must stay under 280 characters as X counts them (URL = 23), or 25,000 for longform posts. The counter flags overruns.
// The theme link is taken from signals.json (absoluteUrl) when available.
const DAILY_POSTS = [
  { day: 'Monday', id: 'agent-interoperability', title: "Agent Interoperability Protocols", longform: true,
    text: "#1 on the radar this week: Agent Interoperability Protocols. #SixTraction\n\nIn plain terms: expose a tool or dataset once through an open protocol, and any compatible AI agent can use it. No custom integration per pairing. MCP covers agent-to-tool links, A2A covers agents talking to each other.\n\nWhat's happening: MoEngage opened roughly 400 private APIs to agents, with per-tool permissions, through Amazon Bedrock AgentCore Gateway instead of one MCP server per service. Google Cloud launched IAM Helper, MCP tools that automate identity and access work. And the official MCP servers shipped v2.2.0, refreshing trusted certificates after a certificate authority's keys were exposed.\n\nWhy it matters: the protocol question is close to settled. The open question is control. When hundreds of internal APIs are within reach, who decides which agent may call what? Treat agent access like employee access: scoped, reviewed and revocable.\n\nA2A: https://a2a-protocol.org/\n\nhttps://techsignalsix.com/themes/agent-interoperability/" },
  { day: 'Tuesday', id: 'ai-coding-agents', title: "AI Coding Agents", longform: true,
    text: "#2 on the radar this week: AI Coding Agents. #SixTraction\n\nQuick recap: a coding agent takes a task in plain language, works through the codebase, runs the tests and hands back a change for a developer to review.\n\nWhat's happening: the new features are about running agents at team scale. GitHub Copilot Fusion is now generally available and picks the AI model for each task automatically. Claude Code added shared monthly spending budgets for teams. Codex can resume queued work. Amazon Bedrock AgentCore gives each agent session a secure URL, so you can watch a live preview while it edits. And OpenHands patched a vulnerable dependency: agent tools have a supply chain too.\n\nWhy it matters: budgets, routing and observability are what you build when a tool goes from experiment to line item. Decide now who owns the spend, which repos agents may touch and how their changes get reviewed.\n\nhttps://techsignalsix.com/themes/ai-coding-agents/" },
  { day: 'Wednesday', id: 'small-language-models', title: "Small Language Models & On-Device AI", longform: true,
    text: "#3 on the radar this week: Small Language Models & On-Device AI. #SixTraction\n\nSmall language models run on a laptop, a phone or one edge server. They will not out-reason the biggest cloud models, but for focused jobs like sorting, extracting or summarizing they are often good enough, and far cheaper and faster.\n\nWhat's happening: Ollama added Liquid AI's LFM3 models, text-to-speech included, on Linux and Windows as well as Macs. Amazon SageMaker AI widened serverless fine-tuning to models such as Qwen3.8 27B and Ministral 3. And Hugging Face's AnyLanguageModel, for local models on Apple platforms, reached 1.0.\n\nWhy it matters: tuning a small model on your own data is becoming a managed, pay-per-use service instead of a research project. The sensible setup is a mix: a small tuned model for everyday volume, a large one for hard cases, and sensitive data on hardware you control.\n\nTry it: https://ollama.com/\n\nhttps://techsignalsix.com/themes/small-language-models/" },
  { day: 'Thursday', id: 'vector-databases-agent-memory', title: "Vector Search & Agent Memory", longform: true,
    text: "#4 on the radar this week: Vector Search & Agent Memory. #SixTraction\n\nWhen you ask an AI about your own documents, it first has to find the right passages. Vector search finds them by meaning, not exact words. The same machinery increasingly gives AI agents a memory across long tasks.\n\nWhat's happening: Qdrant 1.20 added classic keyword ranking (BM25) next to vector search, so one engine matches both meaning and exact terms. LanceDB 0.41 stopped running remote code from stored embedding models unless you allow it. AWS published a pattern where an agent picks between two knowledge bases and cites its sources. Google Cloud brought managed RAG search to its disconnected Distributed Cloud for regulated organizations.\n\nWhy it matters: vector search is now a feature of mainstream databases and managed services, not a bet on a startup. What pays off is unglamorous: clean documents, hybrid search, checkable citations and safe defaults.\n\nDocs: https://qdrant.tech/documentation/\n\nhttps://techsignalsix.com/themes/vector-databases-agent-memory/" },
  { day: 'Friday', id: 'ai-inference-infrastructure', title: "AI Inference Infrastructure", longform: true,
    text: "#5 on the radar this week: AI Inference Infrastructure. #SixTraction\n\nEvery AI request runs through a serving engine that schedules it and streams back the answer. Engines like vLLM, SGLang and NVIDIA's TensorRT-LLM compete on how many users one GPU can serve.\n\nWhat's happening: vLLM shipped version 0.33.0. AWS showed how to run NVIDIA's 120B Nemotron 3.5 Super VL on Kubernetes using Dynamo and vLLM, and put a native PyTorch backend for Trainium into public beta. And Cloudflare disclosed and fixed an SGLang bug, set off by a configuration mismatch, that let cached data from one request turn up in another.\n\nWhy it matters: the serving layer is now both a cost lever and a security boundary. Speed tricks like shared caches deserve the same scrutiny as any code touching customer data. Benchmark your own workloads, keep engines patched and test isolation between users.\n\nCode: https://github.com/sgl-project/sglang\n\nhttps://techsignalsix.com/themes/ai-inference-infrastructure/" },
  { day: 'Saturday', id: 'all-themes', title: "The big lines across all themes", longform: true,
    text: "AI's center of gravity is moving from the model to the machinery around it. #SixTraction\n\nWe track nine technology themes on the Six Traction radar. Look across all of them this week and three patterns stand out.\n\n1. Agents are getting a job description.\nThe releases that matter are about running agents like a workforce: Google Cloud's IAM Helper for agent identity and access, shared spending budgets in Claude Code, automatic model routing in GitHub Copilot Fusion, and live session previews in Amazon Bedrock AgentCore. The question is no longer whether agents work. It is how to govern them.\n\n2. Security is arriving through the plumbing.\nOne certificate authority problem rippled across themes: the MCP reference servers and Rust's installer, rustup, both shipped updates to their trusted certificates. Wasmtime 50.0.1 closed a gap that let sandboxed code send network traffic to addresses it should have been blocked from. LanceDB now refuses remote code by default. And on the post-quantum front, AWS added the ML-KEM standard to KMS and quantum-safe key exchange to Aurora PostgreSQL. Safety is becoming the default setting, not an add-on.\n\n3. AI is getting cheaper to run close to your data.\nOllama keeps widening what runs on ordinary machines, managed fine-tuning makes small models your own, and managed RAG services remove the need to build retrieval yourself, even inside disconnected, regulated environments. Meanwhile serving engines keep squeezing more work out of every chip.\n\nWhat it means for tech leaders: the edge is shifting from picking the smartest model to getting identity, cost control, retrieval quality and secure defaults right. Those are management decisions as much as engineering ones.\n\nAll themes: https://techsignalsix.com/themes/" }
];

function themeUrl(id, signals = []) {
  const s = signals.find(x => x.id === id);
  return (s && s.absoluteUrl) || `https://techsignalsix.com/themes/${id}/`;
}

function generatePosts(data = {}) {
  const signals = data.trendingSignals || [];
  return DAILY_POSTS.map(d => ({
    day: d.day,
    title: d.title,
    longform: !!d.longform,
    // Long-form: first line ends with #SixTraction, footer once. Short posts: lead/why/link + footer.
    text: d.text ? withFooter(d.longform ? withFirstLineTag(d.text) : d.text)
                 : withFooter(`${d.lead}\n\n${d.why}\n\n${themeUrl(d.id, signals)}`)
  }));
}
// =================== END DAILY SPOTLIGHTS ===================

function renderPosts(posts) {
  return posts.map((p, i) => `
      <div class="post">
        <div class="day">${p.day}${p.longform ? ' <span class="pinned-tag" style="margin:0 0 0 0.4rem;padding:0.1rem 0.45rem;font-size:0.62rem;">Long-form</span>' : ''}</div>
        <h2>${escPinned(p.title)}</h2>
        <pre>${escPinned(p.text)}</pre>
        <button type="button" class="btn post-copy" data-idx="${i}">Copy</button>
        ${postToXHtml(p.text)}
        ${counterHtml(p.text, p.longform)}
      </div>`).join('');
}

async function load() {
  const content = document.getElementById('content');
  const meta = document.getElementById('meta');
  let data = null;
  try {
    // no-store + cache-buster so a fresh weekly update is never hidden by a cached copy
    const res = await fetch(`${API}?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
    meta.textContent = `Week ${data.week || '?'} · Published ${data.publishedDate || '?'} · Generated ${new Date(data.generatedAt).toLocaleString()}`;
  } catch (err) {
    meta.textContent = `Could not load signals.json (${err.message}). Showing drafts for ${PINNED_POST.week}.`;
  }
  const stale = data && data.week && data.week !== PINNED_POST.week;
  const posts = generatePosts(data || {});
  content.innerHTML =
    (stale ? `<div class="error">Heads-up: signals.json is ${escPinned(data.week)}, but the prepared posts are for ${escPinned(PINNED_POST.week)}. Update PINNED_POST and DAILY_POSTS in this file.</div>` : '') +
    renderPosts(posts);
  wirePostToX(content);
  content.querySelectorAll('button.post-copy').forEach(btn => {
    btn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(posts[Number(btn.dataset.idx)].text);
        btn.textContent = 'Copied!';
      } catch (e) {
        btn.textContent = 'Copy failed';
      }
      setTimeout(() => { btn.textContent = 'Copy'; }, 1800);
    });
  });
}

renderPinned();
load();
</script>
</body>
</html>
