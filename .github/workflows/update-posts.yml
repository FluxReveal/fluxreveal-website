name: Update X posts from TechSignalSix

on:
  schedule:
    # Kjør hver mandag kl. 06:00 UTC (08:00 CEST)
    - cron: "0 6 * * 1"
  workflow_dispatch: # Manuell kjøring fra GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate posts.json
        run: python3 TechSignalSix/scrape.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add TechSignalSix/posts.json
          git diff --staged --quiet || git commit -m "Update weekly X posts from TechSignalSix"
          git push
