<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FluxReveal — X Post Preview</title>
  <style>
    :root {
      --bg: #060B14;
      --card: #0D1525;
      --border: #1A2438;
      --text: #E8ECF3;
      --muted: #A0AEC0;
      --accent: #00E5FF;
      --accent2: #7AFFD9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 20px;
      line-height: 1.5;
    }

    .container { max-width: 620px; margin: 0 auto; }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 28px;
    }

    .x-post {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .x-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00E5FF, #7AFFD9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #060B14;
      font-size: 1.1rem;
    }

    .user-info strong { display: block; font-size: 1rem; }
    .user-info span { color: var(--muted); font-size: 0.9rem; }

    .post-content {
      font-size: 1.15rem;
      white-space: pre-wrap;
      margin-bottom: 16px;
      line-height: 1.45;
    }

    .post-meta {
      color: var(--muted);
      font-size: 0.9rem;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    button {
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-refresh {
      background: #1A2438;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-refresh:hover { background: #243044; }

    .btn-fetch {
      background: #132033;
      color: var(--accent);
      border: 1px solid #00C2FF55;
    }
    .btn-fetch:hover { background: #1a2d44; }

    .btn-post {
      background: linear-gradient(135deg, #00E5FF, #00C2FF 50%, #7AFFD9);
      color: #060B14;
    }
    .btn-post:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }
    .btn-post:disabled,
    .btn-fetch:disabled,
    .btn-refresh:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }
    .status.info {
      display: block;
      background: #0D1525;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .status.success {
      display: block;
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid var(--accent);
      color: var(--accent);
    }
    .status.error {
      display: block;
      background: rgba(255, 80, 80, 0.1);
      border: 1px solid #ff5050;
      color: #ff8a8a;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>X Post Preview</h1>
    <p class="subtitle">Forhåndsvisning av ukens top signals + value-add teaser</p>

    <div class="x-post" id="postCard">
      <div class="x-header">
        <div class="avatar">TS</div>
        <div class="user-info">
          <strong>TechSignal HQ</strong>
          <span>@TechSignalHQ · Just now</span>
        </div>
      </div>

      <div class="post-content" id="postContent">Laster preview...</div>
      <div class="post-meta" id="postMeta">—</div>
    </div>

    <div class="actions">
      <button class="btn-fetch" id="fetchBtn" onclick="fetchFromTechSignal()">↓ Hent fra TechSignal</button>
      <button class="btn-refresh" id="refreshBtn" onclick="refreshPreview()">↻ Refresh</button>
      <button class="btn-post" id="postBtn" onclick="postToX()">Post to X</button>
    </div>

    <div class="status info" id="status">
      Trykk «Hent fra TechSignal» for å hente live data fra techsignal-six.vercel.app
    </div>

    <footer>FluxReveal · Internal preview tool</footer>
  </div>

  <script>
    // Fallback sample (brukes hvis fetch feiler)
    const sampleData = {
      theme: "AI Agents & Autonomous Workflows",
      week: "2026-W32",
      generated_at: new Date().toISOString(),
      source: "sample",
      stories: [
        { title: "Agent Interoperability Protocols", url: "https://techsignal-six.vercel.app/themes/agent-interoperability/", summary: "Open protocols like MCP are becoming the connection layer." },
        { title: "AI Coding Agents", url: "https://techsignal-six.vercel.app/themes/ai-coding-agents/", summary: "Teams are delegating whole coding tasks to agents." },
        { title: "AI Inference Infrastructure", url: "https://techsignal-six.vercel.app/themes/ai-inference-infrastructure/", summary: "Serving engines decide whether AI features are profitable." },
        { title: "Small Language Models & On-Device AI", url: "https://techsignal-six.vercel.app/themes/small-language-models/", summary: "Models small enough to run on laptops now handle real tasks." },
        { title: "Vector Search & Agent Memory", url: "https://techsignal-six.vercel.app/themes/vector-databases-agent-memory/", summary: "Retrieval quality is what limits AI answers on your own data." }
      ]
    };

    let currentData = sampleData;

    function createTeaser(data) {
      const theme = data.theme || "This week's key signals";
      const week = data.week ? ` (${data.week})` : "";
      return `This week's signal${week}: ${theme}\n\nTop signals worth your attention:`;
    }

    function buildPostText(data) {
      const teaser = createTeaser(data);
      const lines = (data.stories || []).slice(0, 5).map((s, i) => `${i + 1}. ${s.title}`);
      const footer = `\n\nFull context → techsignal-six.vercel.app`;
      return `${teaser}\n\n${lines.join("\n")}${footer}`;
    }

    function renderPreview(data) {
      currentData = data;
      document.getElementById("postContent").textContent = buildPostText(data);
      const date = new Date(data.generated_at || Date.now());
      const source = data.source === "live" ? "Live from TechSignal" : "Sample data";
      document.getElementById("postMeta").textContent =
        `${date.toLocaleString("no-NO")} · ${source}`;
    }

    function showStatus(msg, type) {
      const el = document.getElementById("status");
      el.textContent = msg;
      el.className = `status ${type}`;
    }

    function setLoading(isLoading) {
      document.getElementById("fetchBtn").disabled = isLoading;
      document.getElementById("refreshBtn").disabled = isLoading;
      document.getElementById("postBtn").disabled = isLoading;
    }

    // Hent og parse HTML fra TechSignal
    async function fetchFromTechSignal() {
      setLoading(true);
      showStatus("Henter data fra techsignal-six.vercel.app ...", "info");

      try {
        const res = await fetch("https://techsignal-six.vercel.app/", {
          method: "GET",
          mode: "cors",
          cache: "no-store"
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const html = await res.text();
        const data = parseTechSignalHtml(html);

        if (!data.stories || data.stories.length === 0) {
          throw new Error("Fant ingen themes i HTML");
        }

        renderPreview(data);
        showStatus(`Hentet ${data.stories.length} signals fra TechSignal (${data.week || "ukjent uke"})`, "success");
      } catch (err) {
        console.error(err);
        renderPreview({ ...sampleData, generated_at: new Date().toISOString() });
        showStatus(`Kunne ikke hente live data (${err.message}). Viser sample i stedet.`, "error");
      } finally {
        setLoading(false);
      }
    }

    // Enkel HTML-parser for top themes
    function parseTechSignalHtml(html) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, "text/html");

      // Prøv å finne uke
      let week = "";
      const weekMatch = html.match(/Weekly radar\s*·\s*(20\d{2}-W\d{1,2})/i)
                     || html.match(/(20\d{2}-W\d{1,2})/);
      if (weekMatch) week = weekMatch[1];

      // Prøv å finne editorial / theme-setning
      let theme = "This week's key technology signals";
      const editorial = doc.querySelector("p")?.textContent || "";
      // Fallback: bruk første sterke signal-setning hvis vi finner den
      const signalText = html.match(/This week'?s signal[\s\S]{0,200}?([A-Z][^<\n]{20,120})/i);
      if (signalText) theme = signalText[1].trim();

      // Hent theme-lenker (typisk /themes/...)
      const links = [...doc.querySelectorAll('a[href*="/themes/"]')];
      const seen = new Set();
      const stories = [];

      for (const a of links) {
        const href = a.getAttribute("href") || "";
        const title = (a.textContent || "").trim();
        if (!title || title.length < 4) continue;
        if (seen.has(href)) continue;
        // Hopp over generiske lenker
        if (/search all themes|open signal|see the evidence/i.test(title)) continue;

        seen.add(href);
        stories.push({
          title,
          url: href.startsWith("http") ? href : `https://techsignal-six.vercel.app${href}`,
          summary: ""
        });

        if (stories.length >= 5) break;
      }

      // Hvis parseren fant lite, bruk hardkodede top 5 fra kjent struktur
      if (stories.length < 3) {
        return {
          ...sampleData,
          week: week || sampleData.week,
          generated_at: new Date().toISOString(),
          source: "live-fallback"
        };
      }

      return {
        theme,
        week,
        generated_at: new Date().toISOString(),
        source: "live",
        stories
      };
    }

    function refreshPreview() {
      renderPreview({
        ...currentData,
        generated_at: new Date().toISOString()
      });
      showStatus("Preview oppdatert", "success");
    }

    function postToX() {
      const btn = document.getElementById("postBtn");
      btn.disabled = true;
      showStatus("Posting er deaktivert i preview. Ekte publisering skjer via GitHub Actions.", "info");
      setTimeout(() => { btn.disabled = false; }, 1800);
    }

    // Start med sample
    renderPreview(sampleData);
  </script>
</body>
</html>
